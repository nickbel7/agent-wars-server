<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Wars — Nikos Client</title>
  <style>
    /* ======== Reset & Fonts ================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --bg:          #0a0c0f;
      --surface:     #111318;
      --surface2:    #1a1d24;
      --border:      #2a2d35;
      --accent:      #00e5ff;
      --accent2:     #7c3aed;
      --danger:      #ff4444;
      --warning:     #ffaa00;
      --success:     #00cc66;
      --text:        #e8eaf0;
      --text-muted:  #6b7280;
      --agent-size:  40px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ======== Header / HUD ================================================= */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .logo span { color: var(--text-muted); }

    #join-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    #join-panel input[type="text"] {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      width: 180px;
      transition: border-color 0.2s;
    }

    #join-panel input[type="text"]:focus {
      border-color: var(--accent);
    }

    #join-panel input[type="color"] {
      width: 36px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      padding: 2px;
    }

    #join-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #join-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    #join-btn:active { transform: translateY(0); }
    #join-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ======== Stats HUD ==================================================== */
    .hud {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 60px;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    /* ======== Layout ======================================================= */
    .layout {
      display: grid;
      grid-template-columns: 1fr 240px;
      overflow: hidden;
      height: calc(100vh - 54px);
    }

    /* ======== Board area =================================================== */
    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow: auto;
      padding: 16px;
    }

    canvas {
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: crosshair;
      display: block;
      flex-shrink: 0;
    }

    /* Repair progress overlay (injected dynamically, positioned via JS) */
    .repair-overlay {
      position: absolute;
      pointer-events: none;
      text-align: center;
      transform: translateX(-50%);
    }

    .repair-bar-wrap {
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      width: 80px;
      height: 8px;
      border: 1px solid var(--accent);
    }

    .repair-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 8px;
      transition: width 0.1s linear;
    }

    .repair-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
      text-shadow: 0 0 6px var(--accent);
    }

    /* ======== Sidebar ====================================================== */
    .sidebar {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Agents list */
    #agents-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding: 14px 16px;
    }

    .agent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    .agent-item.is-me {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.04);
    }

    .agent-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .agent-name {
      font-size: 12px;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--accent);
      color: #000;
      text-transform: uppercase;
    }

    /* Zones list */
    #zones-section {
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      max-height: 220px;
      overflow-y: auto;
    }

    #zones-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 0;
    }

    .zone-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 11px;
    }

    .zone-item.active { border-color: var(--danger); }
    .zone-item.claimed { border-color: var(--warning); }
    .zone-item.resolved { border-color: var(--success); opacity: 0.5; }

    .zone-sev {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }

    .sev-1 { background: rgba(0,200,100,0.2); color: #00cc66; }
    .sev-2 { background: rgba(200,200,0,0.2); color: #cccc00; }
    .sev-3 { background: rgba(255,160,0,0.2); color: #ffaa00; }
    .sev-4 { background: rgba(255,80,0,0.2); color: #ff5000; }
    .sev-5 { background: rgba(255,40,40,0.2); color: #ff2828; }

    .zone-status {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Log */
    #log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px 16px;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
    }

    .log-entry {
      color: var(--text-muted);
      line-height: 1.4;
    }
    .log-entry.info  { color: #4aa8ff; }
    .log-entry.success { color: var(--success); }
    .log-entry.warn  { color: var(--warning); }
    .log-entry.error { color: var(--danger); }

    /* ======== Status bar =================================================== */
    #status-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 4px 16px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      grid-column: 1 / -1;
    }

    #status-bar span { color: var(--accent); }

    /* ======== Connection dot =============================================== */
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .conn-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .conn-dot.error     { background: var(--danger); }

    /* ======== Keyboard hint ================================================ */
    .keys-hint {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .key {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>

  <!-- ===== Header ========================================================= -->
  <header>
    <div class="logo">AGENT<span>/</span>WARS</div>

    <div id="join-panel">
      <div class="conn-dot" id="conn-dot"></div>
      <input id="name-input" type="text" placeholder="Enter your name…" maxlength="30" autofocus />
      <input id="color-input" type="color" value="#00e5ff" title="Agent color" />
      <button id="join-btn" type="button">Join Board</button>
      <div class="keys-hint" id="keys-hint" style="display:none">
        <span><span class="key">Click</span> move</span>
        <span><span class="key">Shift+Click</span> claim zone</span>
        <span><span class="key">Arrow keys</span> nudge</span>
      </div>
    </div>

    <div class="hud">
      <div class="stat">
        <div class="stat-value" id="stat-score">0</div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="stat-zones">0</div>
        <div class="stat-label">Zones Fixed</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="stat-time">0:00</div>
        <div class="stat-label">Time</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="stat-agents">0</div>
        <div class="stat-label">Agents</div>
      </div>
    </div>
  </header>

  <!-- ===== Main layout ==================================================== -->
  <div class="layout">
    <!-- Board -->
    <div class="board-wrapper" id="board-wrapper">
      <canvas id="board" width="1200" height="800"></canvas>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Agents online</div>
      </div>
      <div id="agents-list"></div>

      <div id="zones-section">
        <div class="sidebar-title">Active zones</div>
        <div id="zones-list"></div>
      </div>

      <div id="log-section">
        <div class="sidebar-title">Event log</div>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <!-- ===== Status bar ===================================================== -->
  <div id="status-bar">ready — enter your name and click <span>Join Board</span></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // =========================================================================
    // CONFIG
    // =========================================================================
    const SERVER       = 'https://agent-wars-server-ujkj.onrender.com';
    const REPAIR_MS    = 2000;
    const AGENT_RADIUS = 20;   // half of 40px default size

    // =========================================================================
    // DOM REFS
    // =========================================================================
    const canvas      = document.getElementById('board');
    const ctx         = canvas.getContext('2d');
    const nameIn      = document.getElementById('name-input');
    const colorIn     = document.getElementById('color-input');
    const joinBtn     = document.getElementById('join-btn');
    const connDot     = document.getElementById('conn-dot');
    const statusBar   = document.getElementById('status-bar');
    const keysHint    = document.getElementById('keys-hint');
    const agentsList  = document.getElementById('agents-list');
    const zonesList   = document.getElementById('zones-list');
    const logEl       = document.getElementById('log');
    const statScore   = document.getElementById('stat-score');
    const statZones   = document.getElementById('stat-zones');
    const statTime    = document.getElementById('stat-time');
    const statAgents  = document.getElementById('stat-agents');
    const boardWrap   = document.getElementById('board-wrapper');

    // =========================================================================
    // STATE
    // =========================================================================
    let socket        = null;
    let myId          = null;
    let myName        = '';
    let myColor       = '#00e5ff';
    let joinedAt      = null;

    const agents      = new Map();   // id → Agent
    const zones       = new Map();   // id → Zone

    // Repair tracking for OUR zone claims
    // key = zoneId, value = { startedAt: timestamp, progressEl: HTMLElement }
    const myRepairs   = new Map();

    // My personal stats
    let myZonesFixed  = 0;
    let myScore       = 0;

    // =========================================================================
    // LOGGING
    // =========================================================================
    function log(msg, type = '') {
      const el = document.createElement('div');
      el.className = `log-entry ${type}`;
      const ts = new Date().toLocaleTimeString('en', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
      el.textContent = `[${ts}] ${msg}`;
      logEl.prepend(el);
      // Keep log bounded
      while (logEl.children.length > 80) logEl.removeChild(logEl.lastChild);
    }

    // =========================================================================
    // TIMER
    // =========================================================================
    function updateTimer() {
      if (!joinedAt) return;
      const elapsed = Math.floor((Date.now() - joinedAt) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      statTime.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }
    setInterval(updateTimer, 1000);

    // =========================================================================
    // SIDEBAR UPDATES
    // =========================================================================
    function refreshAgentsList() {
      agentsList.innerHTML = '';
      statAgents.textContent = agents.size;
      for (const a of agents.values()) {
        const item = document.createElement('div');
        item.className = `agent-item${a.id === myId ? ' is-me' : ''}`;
        item.innerHTML = `
          <div class="agent-dot" style="background:${a.color || '#888'}"></div>
          <div class="agent-name">${escHtml(a.name)}</div>
          ${a.id === myId ? '<div class="agent-badge">You</div>' : ''}
        `;
        agentsList.appendChild(item);
      }
    }

    function refreshZonesList() {
      zonesList.innerHTML = '';
      const activeZones = [...zones.values()].filter(z => z.status !== 'resolved');
      if (activeZones.length === 0) {
        zonesList.innerHTML = '<div style="font-size:11px;color:var(--text-muted);padding:4px 0">No active zones</div>';
        return;
      }
      for (const z of activeZones) {
        const item = document.createElement('div');
        const claimed = z.claimedBy ? 'claimed' : 'active';
        item.className = `zone-item ${z.status === 'resolved' ? 'resolved' : claimed}`;
        const sevClass = `sev-${Math.min(5, Math.max(1, z.severity))}`;
        const statusText = z.status === 'resolved' ? 'resolved' : (z.claimedBy ? 'repairing' : 'active');
        item.innerHTML = `
          <span class="zone-sev ${sevClass}">SEV ${z.severity}</span>
          <span class="zone-status">${statusText}</span>
        `;
        zonesList.appendChild(item);
      }
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // =========================================================================
    // REPAIR PROGRESS OVERLAYS (DOM-based, on top of canvas)
    // =========================================================================
    function startRepairOverlay(zoneId) {
      const z = zones.get(zoneId);
      if (!z) return;
      if (myRepairs.has(zoneId)) return;

      // Position the overlay relative to board-wrapper
      const overlay = document.createElement('div');
      overlay.className = 'repair-overlay';
      overlay.dataset.zoneId = zoneId;

      overlay.innerHTML = `
        <div class="repair-bar-wrap">
          <div class="repair-bar-fill" style="width:0%"></div>
        </div>
        <div class="repair-label">repairing</div>
      `;
      boardWrap.appendChild(overlay);

      const startedAt = Date.now();
      myRepairs.set(zoneId, { startedAt, overlay });

      function updateOverlay() {
        if (!myRepairs.has(zoneId)) return;
        const elapsed = Date.now() - startedAt;
        const pct = Math.min(100, (elapsed / REPAIR_MS) * 100);
        overlay.querySelector('.repair-bar-fill').style.width = `${pct}%`;

        // Position relative to canvas
        positionOverlay(overlay, z.x, z.y + z.radius + 12);

        if (pct < 100) requestAnimationFrame(updateOverlay);
      }
      requestAnimationFrame(updateOverlay);
    }

    function positionOverlay(overlay, boardX, boardY) {
      const canvasRect  = canvas.getBoundingClientRect();
      const wrapperRect = boardWrap.getBoundingClientRect();
      // Scale factor (canvas might be CSS-scaled)
      const scaleX = canvasRect.width  / canvas.width;
      const scaleY = canvasRect.height / canvas.height;

      const left = canvasRect.left - wrapperRect.left + boardX * scaleX;
      const top  = canvasRect.top  - wrapperRect.top  + boardY * scaleY;
      overlay.style.left = `${left}px`;
      overlay.style.top  = `${top}px`;
    }

    function removeRepairOverlay(zoneId) {
      const entry = myRepairs.get(zoneId);
      if (entry) {
        entry.overlay.remove();
        myRepairs.delete(zoneId);
      }
    }

    // =========================================================================
    // CANVAS RENDER LOOP
    // =========================================================================
    function draw() {
      requestAnimationFrame(draw); // schedule next frame first so loop survives errors
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // -- Background gradient --
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0d1117');
      grad.addColorStop(1, '#0a0c0f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // -- Grid --
      ctx.strokeStyle = 'rgba(42, 45, 53, 0.7)';
      ctx.lineWidth = 1;
      const CELL = 80;
      for (let x = 0; x <= canvas.width; x += CELL) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += CELL) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // -- Axis labels --
      ctx.fillStyle = 'rgba(107, 114, 128, 0.4)';
      ctx.font = '9px Space Mono, monospace';
      ctx.textAlign = 'left';
      for (let x = CELL; x < canvas.width; x += CELL * 2) {
        ctx.fillText(x, x + 2, 10);
      }
      ctx.textAlign = 'right';
      for (let y = CELL; y < canvas.height; y += CELL * 2) {
        ctx.fillText(y, canvas.width - 2, y - 2);
      }

      const now = Date.now();

      // -- Zones --
      for (const z of zones.values()) {
        drawZone(z, now);
      }

      // -- Agents --
      for (const a of agents.values()) {
        drawAgent(a);
      }

      // Update repair overlay positions every frame
      for (const [zoneId, entry] of myRepairs) {
        const z = zones.get(zoneId);
        if (z) positionOverlay(entry.overlay, z.x, z.y + z.radius + 12);
      }
    }

    function drawZone(z, now) {
      const resolved = z.status === 'resolved';
      const claimed  = z.status === 'active' && z.claimedBy;

      const sev = Math.min(5, Math.max(1, z.severity));
      const colors = [
        null,
        { ring: '#00cc66', fill: 'rgba(0,204,102,0.06)', text: '#00cc66' },   // 1
        { ring: '#cccc00', fill: 'rgba(204,204,0,0.07)', text: '#cccc00' },   // 2
        { ring: '#ffaa00', fill: 'rgba(255,170,0,0.08)', text: '#ffaa00' },   // 3
        { ring: '#ff5000', fill: 'rgba(255,80,0,0.10)', text: '#ff5000' },    // 4
        { ring: '#ff2828', fill: 'rgba(255,40,40,0.12)', text: '#ff2828' },   // 5
      ];

      const palette = resolved
        ? { ring: 'rgba(0,204,102,0.3)', fill: 'rgba(0,204,102,0.04)', text: '#00cc66' }
        : colors[sev];

      // Pulsing effect for active unclaimed zones
      let extraRadius = 0;
      if (!resolved && !claimed) {
        extraRadius = Math.sin(now / 500) * 4;
      }

      // Outer glow
      const grd = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.radius + extraRadius + 10);
      grd.addColorStop(0, palette.fill);
      grd.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.radius + extraRadius + 10, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // Fill
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.radius + extraRadius, 0, Math.PI * 2);
      ctx.fillStyle = palette.fill;
      ctx.fill();

      // Ring
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.radius + extraRadius, 0, Math.PI * 2);
      ctx.strokeStyle = resolved ? 'rgba(0,204,102,0.3)' : palette.ring;
      ctx.lineWidth = claimed ? 3 : 1.5;
      ctx.setLineDash(resolved ? [6, 4] : []);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1;

      // Repair arc (sweep) if claimed
      if (claimed && z.repairStartedAt) {
        const elapsed = now - z.repairStartedAt;
        const angle = Math.min(1, elapsed / REPAIR_MS) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.radius + extraRadius, -Math.PI / 2, -Math.PI / 2 + angle);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // Label
      if (!resolved) {
        ctx.fillStyle = palette.text;
        ctx.font = 'bold 12px Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`SEV ${sev}`, z.x, z.y + 5);
        if (claimed) {
          ctx.fillStyle = '#00e5ff';
          ctx.font = '9px Space Grotesk, sans-serif';
          ctx.fillText('REPAIRING', z.x, z.y + 18);
        }
      } else {
        ctx.fillStyle = 'rgba(0,204,102,0.5)';
        ctx.font = 'bold 11px Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('RESOLVED', z.x, z.y + 5);
      }
    }

    function drawAgent(a) {
      const isMe = a.id === myId;
      const half  = (a.size || 40) / 2;
      const color = a.color || '#888';

      // Glow for self
      if (isMe) {
        ctx.shadowBlur = 16;
        ctx.shadowColor = color;
      }

      // Circle body
      ctx.beginPath();
      ctx.arc(a.x, a.y, half, 0, Math.PI * 2);
      ctx.fillStyle = isMe ? color : `${color}cc`;
      ctx.fill();

      // Ring for self
      if (isMe) {
        ctx.beginPath();
        ctx.arc(a.x, a.y, half + 3, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      // Inner dot
      ctx.beginPath();
      ctx.arc(a.x, a.y, half * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = isMe ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.4)';
      ctx.fill();

      // Name tag
      const nameText = isMe ? `▶ ${a.name}` : a.name;
      ctx.font = `${isMe ? 'bold ' : ''}11px Space Grotesk, sans-serif`;
      ctx.textAlign = 'center';
      // Background pill
      const textW = ctx.measureText(nameText).width;
      const pillX = a.x - textW / 2 - 4;
      const pillY = a.y - half - 22;
      ctx.fillStyle = 'rgba(10, 12, 15, 0.75)';
      ctx.beginPath();
      ctx.roundRect(pillX, pillY, textW + 8, 16, 4);
      ctx.fill();
      ctx.fillStyle = isMe ? color : '#c0c4cc';
      ctx.fillText(nameText, a.x, pillY + 12);
    }

    // =========================================================================
    // JOIN FLOW
    // =========================================================================
    joinBtn.addEventListener('click', () => {
      const name = nameIn.value.trim();
      if (!name) { nameIn.focus(); return; }
      joinBtn.disabled = true;
      myName  = name;
      myColor = colorIn.value;

      setStatus('Connecting…');
      socket = io(SERVER);

      socket.on('connect', () => {
        connDot.className = 'conn-dot connected';
        setStatus('Connected — joining board…');
        log('Connected to server', 'info');

        socket.emit('agent:join', { name: myName, color: myColor }, (res) => {
          if (res.error) {
            setStatus(`Error: ${res.error}`);
            log(`Join error: ${res.error}`, 'error');
            joinBtn.disabled = false;
            return;
          }

          myId     = res.agent.id;
          joinedAt = Date.now();

          // Populate initial world state (add own agent first, then others)
          agents.set(res.agent.id, res.agent);
          for (const a of res.agents) agents.set(a.id, a);
          for (const z of res.zones)  zones.set(z.id, z);

          // Hide join UI, show keys hint
          nameIn.disabled    = true;
          colorIn.disabled   = true;
          joinBtn.style.display = 'none';
          keysHint.style.display = 'flex';

          refreshAgentsList();
          refreshZonesList();
          setStatus(`Joined as <span>${escHtml(myName)}</span> — click the board to move`);
          log(`Joined board as "${myName}"`, 'success');
          statAgents.textContent = agents.size;
        });
      });

      socket.on('disconnect', () => {
        connDot.className = 'conn-dot error';
        setStatus('Disconnected from server');
        log('Disconnected', 'error');
      });

      socket.on('connect_error', (err) => {
        connDot.className = 'conn-dot error';
        setStatus(`Connection error: ${err.message}`);
        log(`Connection error: ${err.message}`, 'error');
        joinBtn.disabled = false;
      });

      // ---- Agent events ----------------------------------------------------
      socket.on('agent:joined', (a) => {
        agents.set(a.id, a);
        refreshAgentsList();
        log(`Agent joined: ${a.name}`, 'info');
      });

      socket.on('agent:moved', ({ id, x, y }) => {
        const a = agents.get(id);
        if (a) { a.x = x; a.y = y; }
      });

      socket.on('agent:left', ({ id }) => {
        const a = agents.get(id);
        if (a) log(`Agent left: ${a.name}`, 'warn');
        agents.delete(id);
        refreshAgentsList();
      });

      // ---- Zone events -----------------------------------------------------
      socket.on('zone:spawned', (z) => {
        zones.set(z.id, z);
        refreshZonesList();
        log(`Zone spawned — SEV ${z.severity} at (${Math.round(z.x)}, ${Math.round(z.y)})`, 'warn');
      });

      socket.on('zone:updated', (z) => {
        zones.set(z.id, z);
        refreshZonesList();
        // If we are the claimer, start the overlay
        if (z.claimedBy === myId && !myRepairs.has(z.id)) {
          startRepairOverlay(z.id);
          log(`You claimed zone SEV ${z.severity} — hold position!`, 'success');
        }
      });

      socket.on('zone:resolved', (z) => {
        zones.set(z.id, z);
        removeRepairOverlay(z.id);
        refreshZonesList();

        if (z.claimedBy === myId || myRepairs.has(z.id)) {
          myZonesFixed++;
          myScore += z.severity * 100;
          statZones.textContent = myZonesFixed;
          statScore.textContent = myScore;
          log(`Zone resolved! +${z.severity * 100} pts (SEV ${z.severity})`, 'success');
        } else {
          log(`Zone resolved by another agent`, 'info');
        }
        // Clean up resolved zones after 3s
        setTimeout(() => zones.delete(z.id), 3000);
      });
    });

    // =========================================================================
    // MOVEMENT — click on board
    // =========================================================================
    canvas.addEventListener('click', (e) => {
      if (!socket || !myId) return;

      const rect  = canvas.getBoundingClientRect();
      const scaleX = canvas.width  / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top)  * scaleY;

      // Move
      socket.emit('agent:move', { x, y });
      const me = agents.get(myId);
      if (me) { me.x = x; me.y = y; }

      // Auto-claim any active zone we land in
      for (const z of zones.values()) {
        if (z.status !== 'active') continue;
        const dist = Math.hypot(z.x - x, z.y - y);
        if (dist <= z.radius) {
          socket.emit('zone:claim', { zoneId: z.id }, (res) => {
            if (res && res.ok) {
              log(`Claimed zone ${z.id} (SEV ${z.severity})`, 'success');
            }
          });
          break;
        }
      }
    });

    // =========================================================================
    // MOVEMENT — arrow keys (nudge)
    // =========================================================================
    const NUDGE = 20;
    document.addEventListener('keydown', (e) => {
      if (!socket || !myId) return;
      const me = agents.get(myId);
      if (!me) return;

      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft')  dx = -NUDGE;
      if (e.key === 'ArrowRight') dx =  NUDGE;
      if (e.key === 'ArrowUp')    dy = -NUDGE;
      if (e.key === 'ArrowDown')  dy =  NUDGE;
      if (!dx && !dy) return;

      e.preventDefault();
      const nx = Math.max(0, Math.min(canvas.width,  me.x + dx));
      const ny = Math.max(0, Math.min(canvas.height, me.y + dy));
      socket.emit('agent:move', { x: nx, y: ny });
      me.x = nx;
      me.y = ny;

      // Auto-claim
      for (const z of zones.values()) {
        if (z.status !== 'active') continue;
        const dist = Math.hypot(z.x - nx, z.y - ny);
        if (dist <= z.radius) {
          socket.emit('zone:claim', { zoneId: z.id }, (res) => {
            if (res && res.ok) log(`Claimed zone SEV ${z.severity} via keyboard`, 'success');
          });
          break;
        }
      }
    });

    // =========================================================================
    // HELPERS
    // =========================================================================
    function setStatus(html) {
      statusBar.innerHTML = html;
    }

    // =========================================================================
    // KICK OFF RENDER
    // =========================================================================
    draw();
  </script>
</body>
</html>
